<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD de Clientes</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Seus estilos originais (se quiser manter overrides) -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/button.css">
    <link rel="stylesheet" href="css/records.css">
    <link rel="stylesheet" href="css/modal.css">

    <!-- CSS Customizado para ajustar o layout Bootstrap -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #212529;
            color: white;
            padding: 1.5rem 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        main {
            flex: 1;
            padding: 2rem 0;
        }
        footer {
            background-color: #212529;
            color: #adb5bd;
            text-align: center;
            padding: 1rem 0;
            margin-top: auto;
        }
        .table-wrapper {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
            padding: 1.5rem;
            margin-top: 1.5rem;
        }
        /* Ajuste para o Modal Customizado antigo conviver com o visual novo */
        .modal {
            background-color: rgba(0,0,0,0.5);
            backdrop-filter: blur(3px);
        }
        .modal-content {
            border-radius: 12px;
            border: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 1rem;
        }
        .modal-header {
            border-bottom: 1px solid #dee2e6;
            padding-bottom: 1rem;
            margin-bottom: 1rem;
        }
        .modal-field {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border: 1px solid #ced4da;
            border-radius: 6px;
            transition: border-color 0.2s;
        }
        .modal-field:focus {
            outline: none;
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.25);
        }
    </style>

    <!-- Seu Script -->
    <script src="main.js" defer></script>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h3 mb-0 fw-bold"><i class="bi bi-people-fill me-2"></i>Gestão de Clientes</h1>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        
        <!-- Botão de Cadastro -->
        <div class="d-flex justify-content-end">
            <button type="button" class="btn btn-primary shadow-sm" id="cadastrarCliente">
                <i class="bi bi-person-plus-fill me-2"></i>Novo Cliente
            </button>
        </div>

        <!-- Tabela -->
        <div class="table-wrapper table-responsive">
            <table id="tableClient" class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Celular</th>
                        <th>Cidade</th>
                        <th class="text-end">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Os dados reais virão do seu main.js (loadClients) -->
                    <!-- Mantive os dados fake apenas para visualização prévia, o JS vai limpá-los com clearTable() -->
                    <tr>
                        <td class="fw-medium">Maria</td>
                        <td class="text-muted">maria@gmail.com</td>
                        <td>(22) 97165-1111</td>
                        <td>Campos</td>
                        <td class="text-end">
                            <button type="button" class="btn btn-sm btn-outline-success me-1"><i class="bi bi-pencil-square"></i></button>
                            <button type="button" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                        </td>
                    </tr>
                     <tr>
                        <td class="fw-medium">João</td>
                        <td class="text-muted">João@gmail.com</td>
                        <td>(22) 97165-2222</td>
                        <td>Rio das Ostras</td>
                        <td class="text-end">
                            <button type="button" class="btn btn-sm btn-outline-success me-1"><i class="bi bi-pencil-square"></i></button>
                            <button type="button" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                        </td>
                    </tr>
                    <tr>
                        <td class="fw-medium">Jose</td>
                        <td class="text-muted">Jose@gmail.com</td>
                        <td>(22) 97165-3333</td>
                        <td>Macaé</td>
                        <td class="text-end">
                            <button type="button" class="btn btn-sm btn-outline-success me-1"><i class="bi bi-pencil-square"></i></button>
                            <button type="button" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Modal Customizado (Mantido a estrutura ID para o JS funcionar) -->
        <div class="modal" id="modal">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    
                    <header class="modal-header d-flex justify-content-between align-items-center">
                        <h4 class="modal-title fw-bold mb-0">Dados do Cliente</h4>
                        <button type="button" class="btn-close" id="modalClose" aria-label="Close"></button>
                    </header>
                    
                    <div class="modal-body">
                        <form id="form" class="modal-form">
                            <label class="form-label small fw-semibold text-muted mb-1">Nome Completo</label>
                            <input type="text" id="nome" data-index="new" class="modal-field" placeholder="Ex: João da Silva" required>
                            
                            <label class="form-label small fw-semibold text-muted mb-1">E-mail</label>
                            <input type="email" id="email" class="modal-field" placeholder="exemplo@email.com" required>
                            
                            <label class="form-label small fw-semibold text-muted mb-1">Celular</label>
                            <input type="tel" id="celular" class="modal-field" placeholder="(00) 00000-0000" required>
                            
                            <label class="form-label small fw-semibold text-muted mb-1">Cidade</label>
                            <input type="text" id="cidade" class="modal-field" placeholder="Sua cidade" required>
                        </form>
                    </div>

                    <footer class="modal-footer border-0 pt-0">
                        <button type="button" id="cancelar" class="btn btn-secondary">Cancelar</button>
                        <button type="button" id="salvar" class="btn btn-success px-4">Salvar</button>
                    </footer>

                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer>
        <div class="container small">
            Copyright &copy; Luiz Ricardo Thulher Pimentel
        </div>
    </footer>

    <!-- Script do Bootstrap (Opcional, pois seu JS manipula o Modal manualmente) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
