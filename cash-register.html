<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Caixa Registradora — LRT</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  
  <style>
    body {
      background-color: #212529;
      color: #f8f9fa;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .card-custom {
      background-color: #2b3035;
      border: 1px solid #495057;
      border-radius: 12px;
    }
    .status-badge {
      font-size: 1.1rem;
      font-weight: 700;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      display: inline-block;
    }
    .cid-input {
      background-color: #212529;
      border: 1px solid #495057;
      color: #f8f9fa;
    }
    .cid-input:focus {
      background-color: #1a1d20;
      color: #fff;
      border-color: #0d6efd;
      box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
    }
  </style>
</head>
<body class="py-4">

  <div class="container" style="max-width: 900px;">
    
    <!-- Cabeçalho -->
    <header class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary">
      <div>
        <h1 class="h3 fw-bold mb-1"><i class="bi bi-cash-stack me-2 text-success"></i>Caixa Registradora</h1>
        <p class="text-secondary small mb-0">Algoritmo Simulador de troco com controle de gaveta (freeCodeCamp Project)</p>
      </div>
      <a href="index.html" class="btn btn-outline-light btn-sm">
        <i class="bi bi-arrow-left me-1"></i> Voltar ao Portfólio
      </a>
    </header>

    <div class="row g-4">
      
      <!-- Formulário de Operação -->
      <div class="col-12 col-md-6">
        <div class="card card-custom p-3 h-100 shadow-sm">
          <h2 class="h5 fw-bold mb-3"><i class="bi bi-cart-check me-2"></i>Operação de Venda</h2>
          
          <form id="calcForm">
            <div class="mb-3">
              <label class="form-label small text-secondary">Preço Total (R$)</label>
              <div class="input-group">
                <span class="input-group-text bg-dark border-secondary text-secondary">R$</span>
                <input type="number" step="0.01" min="0" class="form-control cid-input" id="itemPrice" value="19.50" required>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label small text-secondary">Valor Pago pelo Cliente (R$)</label>
              <div class="input-group">
                <span class="input-group-text bg-dark border-secondary text-secondary">R$</span>
                <input type="number" step="0.01" min="0" class="form-control cid-input" id="itemCash" value="20.00" required>
              </div>
            </div>

            <div class="d-flex gap-2 mb-3">
              <button type="submit" class="btn btn-success flex-grow-1">
                <i class="bi bi-calculator me-1"></i> Calcular Troco
              </button>
              <button type="button" class="btn btn-outline-secondary" onclick="resetDemo()">
                <i class="bi bi-arrow-clockwise"></i> Reset
              </button>
            </div>
          </form>

          <!-- Resultado do Troco -->
          <div id="resultArea" class="mt-auto pt-3 border-top border-secondary" style="display: none;">
            <h3 class="h6 fw-bold text-secondary mb-2">Resultado da Operação:</h3>
            <div id="statusBadgeContainer" class="mb-3"></div>
            
            <div id="changeDetails" class="small">
              <!-- Detalhes do troco gerados dinamicamente -->
            </div>
          </div>

        </div>
      </div>

      <!-- Gaveta de Dinheiro (Cash in Drawer) -->
      <div class="col-12 col-md-6">
        <div class="card card-custom p-3 h-100 shadow-sm">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h5 fw-bold mb-0"><i class="bi bi-safe me-2"></i>Gaveta de Caixa (CID)</h2>
            <span class="badge bg-secondary" id="totalDrawerBadge">Total: R$ 0,00</span>
          </div>
          <p class="small text-secondary mb-3">Edite os valores disponíveis em caixa para testar diferentes cenários:</p>

          <form id="cidForm" class="row g-2">
            <!-- Moedas e Notas -->
            <div class="col-6">
              <label class="form-label small mb-1 text-secondary">Penny (R$ 0,01)</label>
              <input type="number" step="0.01" min="0" class="form-control form-control-sm cid-input cid-val" data-unit="PENNY" value="1.01">
            </div>
            <div class="col-6">
              <label class="form-label small mb-1 text-secondary">Nickel (R$ 0,05)</label>
              <input type="number" step="0.01" min="0" class="form-control form-control-sm cid-input cid-val" data-unit="NICKEL" value="2.05">
            </div>
            <div class="col-6">
              <label class="form-label small mb-1 text-secondary">Dime (R$ 0,10)</label>
              <input type="number" step="0.01" min="0" class="form-control form-control-sm cid-input cid-val" data-unit="DIME" value="3.10">
            </div>
            <div class="col-6">
              <label class="form-label small mb-1 text-secondary">Quarter (R$ 0,25)</label>
              <input type="number" step="0.01" min="0" class="form-control form-control-sm cid-input cid-val" data-unit="QUARTER" value="4.25">
            </div>
            <div class="col-6">
              <label class="form-label small mb-1 text-secondary">One (R$ 1,00)</label>
              <input type="number" step="0.01" min="0" class="form-control form-control-sm cid-input cid-val" data-unit="ONE" value="90.00">
            </div>
            <div class="col-6">
              <label class="form-label small mb-1 text-secondary">Five (R$ 5,00)</label>
              <input type="number" step="0.01" min="0" class="form-control form-control-sm cid-input cid-val" data-unit="FIVE" value="55.00">
            </div>
            <div class="col-6">
              <label class="form-label small mb-1 text-secondary">Ten (R$ 10,00)</label>
              <input type="number" step="0.01" min="0" class="form-control form-control-sm cid-input cid-val" data-unit="TEN" value="20.00">
            </div>
            <div class="col-6">
              <label class="form-label small mb-1 text-secondary">Twenty (R$ 20,00)</label>
              <input type="number" step="0.01" min="0" class="form-control form-control-sm cid-input cid-val" data-unit="TWENTY" value="60.00">
            </div>
            <div class="col-12">
              <label class="form-label small mb-1 text-secondary">One Hundred (R$ 100,00)</label>
              <input type="number" step="0.01" min="0" class="form-control form-control-sm cid-input cid-val" data-unit="ONE HUNDRED" value="100.00">
            </div>
          </form>

        </div>
      </div>

    </div>

  </div>

  <script>
  // Função auxiliar segura para converter texto em número (trata vírgula ou ponto)
  function parseVal(val) {
    if (typeof val === 'number') return val;
    if (!val) return 0;
    return parseFloat(String(val).replace(',', '.')) || 0;
  }

  // Algoritmo do freeCodeCamp com precisão em centavos
  function checkCashRegister(price, cash, cid) {
    let change = Math.round(cash * 100) - Math.round(price * 100);
    let cidTotal = 0;
    
    for (let elem of cid) {
      cidTotal += Math.round(elem[1] * 100);
    }
    
    if (change < 0) {
      return { status: "ERROR_NEGATIVE", change: [] };
    }
    
    if (change === 0) {
      return { status: "EXACT_PAYMENT", change: [] };
    }

    if (change > cidTotal) {
      return { status: "INSUFFICIENT_FUNDS", change: [] };
    } else if (change === cidTotal) {
      return { status: "CLOSED", change: cid };
    } else {
      let answer = [];
      // Copia profunda para não alterar os inputs visuais
      let cidCopy = JSON.parse(JSON.stringify(cid)).reverse();
      let moneyUnits = { 
        "ONE HUNDRED": 10000, 
        "TWENTY": 2000, 
        "TEN": 1000, 
        "FIVE": 500, 
        "ONE": 100, 
        "QUARTER": 25, 
        "DIME": 10, 
        "NICKEL": 5, 
        "PENNY": 1 
      };

      for (let elem of cidCopy) {
        let holder = [elem[0], 0];
        let available = Math.round(elem[1] * 100);
        let unitValue = moneyUnits[elem[0]];

        while (change >= unitValue && available > 0) {
          change -= unitValue;
          available -= unitValue;
          holder[1] += unitValue / 100;
        }

        if (holder[1] > 0) {
          answer.push(holder);
        }
      }

      if (change > 0) {
        return { status: "INSUFFICIENT_FUNDS", change: [] };
      }
      
      return { status: "OPEN", change: answer };
    }
  }

  // Leitura dos valores da gaveta com tratamento de vírgula
  function getCIDFromInputs() {
    const inputs = document.querySelectorAll('.cid-val');
    const cid = [];
    inputs.forEach(input => {
      cid.push([input.dataset.unit, parseVal(input.value)]);
    });
    return cid;
  }

  // Atualiza badge de total na gaveta
  function updateTotalDrawer() {
    const cid = getCIDFromInputs();
    const total = cid.reduce((acc, curr) => acc + curr[1], 0);
    document.getElementById('totalDrawerBadge').textContent = `Total: R$ ${total.toFixed(2).replace('.', ',')}`;
  }

  // Manipulador do formulário de cálculo
  document.getElementById('calcForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const price = parseVal(document.getElementById('itemPrice').value);
    const cash = parseVal(document.getElementById('itemCash').value);
    const cid = getCIDFromInputs();

    const result = checkCashRegister(price, cash, cid);
    
    const resultArea = document.getElementById('resultArea');
    const badgeContainer = document.getElementById('statusBadgeContainer');
    const details = document.getElementById('changeDetails');
    
    resultArea.style.display = 'block';

    if (result.status === "OPEN") {
      badgeContainer.innerHTML = '<span class="status-badge bg-success text-white"><i class="bi bi-check-circle me-1"></i> STATUS: OPEN (Troco Disponível)</span>';
      
      const changeDue = ((cash - price)).toFixed(2).replace('.', ',');
      let html = `<p class="mb-2 text-light">Troco devido: <strong>R$ ${changeDue}</strong></p><ul class="list-group list-group-flush rounded bg-dark">`;
      result.change.forEach(([unit, val]) => {
        html += `<li class="list-group-item bg-dark text-light border-secondary d-flex justify-content-between"><span>${unit}</span><strong>R$ ${val.toFixed(2).replace('.', ',')}</strong></li>`;
      });
      html += `</ul>`;
      details.innerHTML = html;

    } else if (result.status === "CLOSED") {
      badgeContainer.innerHTML = '<span class="status-badge bg-warning text-dark"><i class="bi bi-exclamation-triangle me-1"></i> STATUS: CLOSED (Gaveta Esvaziada)</span>';
      details.innerHTML = `<p class="text-secondary mb-0">O valor do troco esgotou exatamente todo o dinheiro em caixa.</p>`;

    } else if (result.status === "INSUFFICIENT_FUNDS") {
      badgeContainer.innerHTML = '<span class="status-badge bg-danger text-white"><i class="bi bi-x-circle me-1"></i> STATUS: INSUFFICIENT_FUNDS</span>';
      details.innerHTML = `<p class="text-danger mb-0">Não há saldo suficiente ou faltam cédulas/moedas menores para compor o troco exato.</p>`;

    } else if (result.status === "EXACT_PAYMENT") {
      badgeContainer.innerHTML = '<span class="status-badge bg-info text-dark"><i class="bi bi-info-circle me-1"></i> Pagamento Exato</span>';
      details.innerHTML = `<p class="text-secondary mb-0">Nenhum troco é necessário.</p>`;

    } else if (result.status === "ERROR_NEGATIVE") {
      badgeContainer.innerHTML = '<span class="status-badge bg-danger text-white">Valor Insuficiente Pago</span>';
      details.innerHTML = `<p class="text-danger mb-0">O cliente pagou menos do que o valor total da compra.</p>`;
    }
  });

  // Atualiza em tempo real enquanto digita
  document.querySelectorAll('.cid-val').forEach(input => {
    input.addEventListener('input', updateTotalDrawer);
  });

  function resetDemo() {
    document.getElementById('itemPrice').value = "19.50";
    document.getElementById('itemCash').value = "20.00";
    const defaults = {
      "PENNY": 1.01, "NICKEL": 2.05, "DIME": 3.10, "QUARTER": 4.25,
      "ONE": 90.00, "FIVE": 55.00, "TEN": 20.00, "TWENTY": 60.00, "ONE HUNDRED": 100.00
    };
    document.querySelectorAll('.cid-val').forEach(input => {
      input.value = defaults[input.dataset.unit].toFixed(2);
    });
    document.getElementById('resultArea').style.display = 'none';
    updateTotalDrawer();
  }

  // Inicializa o total na primeira carga
  updateTotalDrawer();
  </script>
</body>
</html>
